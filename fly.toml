# Fly.io settings. One always-on machine, one process, the spending record on a persistent volume.
# Set `app` to your own unique name before the first deploy (see README → Deploy).
app = "incident-room-demo"
primary_region = "iad"
swap_size_mb = 256   # safety buffer for the 256 MB machine (top-level key: keep it above the first [section])

[build]

[env]
  BUDGET_DB = "/data/budget.db"
  TRUST_FLY_CLIENT_IP = "1"
  BUDGET_TOTAL_USD = "5"
  BUDGET_JUDGE_USD = "1"
  BUDGET_END_DATE = "2026-12-15"

[[mounts]]
  source = "budget_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/scenario"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
